name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["trunk"]
  workflow_dispatch:

jobs:
  test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: tsc --noEmit

      - name: Test
        run: npm run test
